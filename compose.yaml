name: broker-gateway

# v2.0.0-Stack: BG_BACKEND=tws ist der Default, cpgateway ist ein
# Roll-Back-Profil. Migration v1.x -> v2.0 ist Karte 5 (Hard-Cutover).
#
# Standard-Aufruf:
#   ./ops/build-gateway.sh --env=live              # Live-Stack auf TWS
#   ./ops/build-gateway.sh --env=paper             # Paper-Stack auf TWS
#
# Notfall-Roll-Back:
#   ./ops/rollback-to-cp.sh --env=live             # Live zurueck auf cpgateway
#   ./ops/rollback-to-cp.sh --env=paper            # Paper zurueck auf cpgateway
# Beide Skripte ziehen compose.cp-legacy.yaml als Override.

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: broker-gateway:2.8.2
    container_name: ${COMPOSE_PROJECT_NAME:-broker-gateway}
    restart: unless-stopped
    # Extern 4000 (Live laut API-Draft 1.1) bzw. 4001 fuer den
    # Paper-Stack (siehe ops/build-gateway.sh --env=paper). Intern
    # 8000 (FastAPI/Dockerfile-CMD). Port 8000 ist auf cma-pi-1 von
    # KanPrompt belegt.
    ports:
      - "${BG_GATEWAY_HOST_PORT:-4000}:8000"
    # .env liegt nur lokal und ist gitignored - enthaelt mindestens
    # BG_BOOTSTRAP_ADMIN_TOKEN. Vorlage in .env.example. Beim
    # paper-Deploy ueber ops/build-gateway.sh --env=paper kommt
    # docker compose --env-file .env.paper zum Einsatz.
    #
    # BG_BACKEND defaultet auf tws (Karte 5, v2.0.0). Wer den
    # cpgateway-Pfad braucht (Notfall-Roll-Back), ruft
    # ops/rollback-to-cp.sh, das compose.cp-legacy.yaml zieht und
    # BG_BACKEND=cp ueberschreibt.
    #
    # BG_TOKEN_FILE (Karte b05206c7, v2.1.4): persistierende Token-
    # Datei via FileTokenStore (docs/04-security.md Sektion 2.2).
    # Ohne diese Variable nutzt der Service InMemoryTokenStore -
    # erzeugte API-Tokens verlieren ihren State beim Service-Restart.
    # Default-Pfad /var/lib/broker-gateway/tokens.json kommt aus dem
    # gemounteten Host-Verzeichnis (siehe volumes-Block unten).
    environment:
      - BG_BACKEND=${BG_BACKEND:-tws}
      - BG_TWS_HOST=${BG_TWS_HOST:-tws}
      - BG_TWS_PORT=${BG_TWS_PORT:-4004}
      - BG_TWS_HEARTBEAT_SEC=${BG_TWS_HEARTBEAT_SEC:-60}
      # Gemeinsamer read-only-Schalter mit dem tws-Container (READ_ONLY_API
      # unten). Default yes: der gateway-TWSClient verbindet read-only und
      # der OrdersService lehnt place/modify mit 503 ab. BG_TWS_READ_ONLY=no
      # macht BEIDE write-faehig - sonst meldet der tws no, der gateway
      # bliebe aber read-only (stille Diskrepanz).
      - BG_TWS_READ_ONLY=${BG_TWS_READ_ONLY:-yes}
      - BG_TOKEN_FILE=${BG_TOKEN_FILE:-/var/lib/broker-gateway/tokens.json}
    env_file:
      - path: ${BG_ENV_FILE:-.env}
        required: false
    volumes:
      # Persistiert die Token-Datei ueber Service-Restarts hinweg.
      # Host-Pfad standardmaessig im Stack-Repo (./var/broker-gateway);
      # auf cma-pi-1 zeigt BG_TOKEN_DIR_HOST auf /var/lib/broker-gateway
      # (Mode 0700 root:root, im Container ueber FileTokenStore-chmod 0600).
      - ${BG_TOKEN_DIR_HOST:-./var/broker-gateway}:/var/lib/broker-gateway
    depends_on:
      tws:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # IB Gateway via gnzsnz/ib-gateway:stable (TWS-Socket-API, Karte 5).
  #
  # gnzsnz/ib-gateway packt das offizielle IB Gateway 10.x mit IBC
  # (Interactive Brokers Controller) + Xvfb in ein headless-faehiges
  # Image. IBC handhabt den Login-Dialog, klickt die Configure-Settings
  # ("Allow connections from localhost only" off, ReadOnlyAPI on,
  # Bypass-Warnings) und betreibt den Restart-Loop nach IBKR-Reconnects.
  # Das Image forwardet die TWS-Socket-API ueber socat von 4001/4002 auf
  # 4003/4004 - dadurch bleibt die App-Side erreichbar trotz des
  # localhost-only-Defaults.
  #
  # Pflicht-ENV (aus .env-File oder /etc/default/broker-gateway-{paper,live}):
  #   BG_TWS_USERNAME       IBKR-Login (cborlm399 paper, chmangold live)
  #   BG_TWS_PASSWORD       Passwort - NIEMALS einchecken
  #
  # Live-Account chmangold braucht Mobile-2FA bei jedem Container-Start.
  # IBC erkennt den 2FA-Prompt und wartet, der User muss am Handy OK
  # druecken. Bei Saturday-Reset (~05:00 UTC am Sonntag) verliert die
  # Session, IBC restarted automatisch und triggert wieder 2FA.
  # ---------------------------------------------------------------------------
  tws:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: ${COMPOSE_PROJECT_NAME:-broker-gateway}-tws
    restart: unless-stopped
    environment:
      - TWS_USERID=${BG_TWS_USERNAME:?BG_TWS_USERNAME required (set in .env or /etc/default/broker-gateway-*)}
      - TWS_PASSWORD=${BG_TWS_PASSWORD:?BG_TWS_PASSWORD required}
      - TRADING_MODE=${BG_TWS_TRADING_MODE:-paper}
      - VNC_SERVER_PASSWORD=${BG_TWS_VNC_PASSWORD:-}
      # Mappt auf SecondFactorDevice in IBC config.ini (gnzsnz envsubst-
      # Mechanik). Default "IB Key" -> IBC akzeptiert das Default-
      # Highlight im 2FA-Dropdown automatisch und klickt OK; IBKR sendet
      # daraufhin den Push aufs Handy. Operator muss nur am Handy
      # bestaetigen, kein VNC-Klick mehr noetig. Verifiziert 2026-05-09
      # mit chmangold/U25235077 (damals aktiver Live-Account, bis
      # Cutover 2026-06-08) - die einzigen Werte im Dropdown sind
      # "IB Key" und "Mobile Authenticator app".
      # Das aktive Live-Konto (dediziertes Service-Konto) nutzt diesen
      # Pfad. Paper (cborlm399) hat kein 2FA, ENV bleibt unbenutzt.
      - TWOFA_DEVICE=${BG_TWS_2FA_DEVICE:-IB Key}
      # Mappt auf ExistingSessionDetectedAction in der IBC-config.ini
      # (gnzsnz envsubst-Mechanik, gleiches Muster wie TWOFA_DEVICE).
      # Default "primary": diese Service-Session behaelt die Session-
      # Hoheit. Loggt sich jemand parallel am selben Konto an (z.B. der
      # Operator manuell am Paper-Konto), beantwortet IBC den "Existing
      # session detected"-Dialog automatisch und haelt die laufende
      # Session, statt unbegrenzt auf eine Auswahl zu warten. Ohne den
      # Wert (Default leer -> IBC behandelt es als "manual") blieb der
      # Login haengen und tws-health meldete dauerhaft connected=false
      # (Karte 234923e9). Eine "primary"-Session wird zudem nach
      # manueller Verdraengung automatisch wieder reconnectet. Override
      # je Stack per BG_TWS_EXISTING_SESSION_ACTION (secondary | manual |
      # primaryoverride).
      - EXISTING_SESSION_DETECTED_ACTION=${BG_TWS_EXISTING_SESSION_ACTION:-primary}
      # Schaltet "Allow connections from localhost only" off, damit der
      # gateway-Container ueber das Compose-Bridge-Netz reinkommt.
      - TWS_ACCEPT_INCOMING=accept
      # Read-Only haelt den Trade-Knopf zu, solange wir nur die Read-
      # Pfade brauchen. Order-Submission kommt in einer Folge-Karte.
      - READ_ONLY_API=${BG_TWS_READ_ONLY:-yes}
      - BYPASS_WARNING=yes
      - TIME_ZONE=Europe/Vienna
    # Kein ports-Block: VNC ist im Default-Stack aus (Karte 9b4d8982 +
    # c44f7d12). Wer wirklich VNC-Inspect braucht, legt ein
    # compose.tws-vnc-debug.yaml lokal in /mnt/ssd/broker-gateway/ ab
    # (Snippet in Memory project_live_2fa_gnzsnz_pattern) und ruft
    # docker compose -f compose.yaml -f compose.tws-vnc-debug.yaml ...
    # Der temp-Override setzt VNC_SERVER_PASSWORD und mappt 5906->5900.
    healthcheck:
      # Prueft den TATSAECHLICHEN IB-Gateway-API-Listener, nicht nur den
      # socat-Forward (4003 live / 4004 paper). socat akzeptiert die TCP-
      # Verbindung auf dem Forward-Port auch dann, wenn das Backend (IB-
      # Gateway-API 4001 live / 4002 paper) tot ist und der Forward beim
      # Durchreichen `Connection refused` bekommt - dadurch meldete der
      # alte /dev/tcp-Check auf den Forward-Port faelschlich `healthy`
      # trotz toter API-Session (Karte c7daadee: Live-Ausfall ~9 h
      # unbemerkt, weil `healthy` kein Beleg fuer eine lebende Session war).
      #
      # Der API-Port leitet sich aus TRADING_MODE ab (live -> 4001 = hex
      # 0FA1, paper -> 4002 = hex 0FA2) - das ist die Container-eigene ENV,
      # unabhaengig vom gateway-seitigen BG_TWS_PORT-Forward. Der grep
      # matcht eine LISTEN-Zeile (Status 0A, remote all-zero:0000) auf dem
      # API-Port. Geprueft werden BEIDE Tabellen /proc/net/tcp (IPv4) UND
      # /proc/net/tcp6 (IPv6): je nach JVM-Stack bindet IB Gateway den Port
      # auf den IPv6-Wildcard (-> tcp6) oder auf IPv4-127.0.0.1 (-> tcp,
      # 8-stellige local-Adresse) - gnzsnz-socat forwardet zum IPv4-
      # Loopback, daher ist IPv4-Bind moeglich. Die remote-Adresse ist bei
      # LISTEN je Tabelle 8 (v4) bzw. 32 (v6) Hex-Stellen all-zero; die
      # Alternation deckt beide ab. bash + grep reichen, kein nc/python.
      # `$$` = Container-Shell-Variable (nicht von docker compose
      # interpoliert).
      test:
        - "CMD-SHELL"
        - 'if [ "$$TRADING_MODE" = live ]; then p=0FA1; else p=0FA2; fi; grep -Eqi ":$$p (00000000|00000000000000000000000000000000):0000 0A " /proc/net/tcp /proc/net/tcp6'
      interval: 30s
      timeout: 5s
      # retries x interval = 5 x 30 s = 150 s Toleranz federt das taegliche
      # IBC-Auto-Restart-Fenster (App-Neustart, API-Listener kurz weg) ab,
      # ohne einen echten Ausfall lange als `healthy` zu verschleiern.
      retries: 5
      # IB Gateway + IBC brauchen ~2 min bis der API-Listener steht (Splash,
      # Xvfb, Login, Configure-Click), bei Live-2FA laenger. start_period
      # zaehlt Fehlschlaege in dieser Phase NICHT als unhealthy; ein
      # erfolgreicher Check schaltet trotzdem sofort auf `healthy`. 300 s
      # deckt den Kaltstart inklusive typischem 2FA-Wartefenster ab. (Vorher
      # fehlte start_period ganz - mit dem Listener-Check zwingend noetig,
      # sonst false-unhealthy waehrend des Startups.)
      start_period: 300s
    # Kein Default-Volume auf /home/ibgateway/Jts: gnzsnz erwartet ein
    # vom Image vorinitialisiertes Verzeichnis (mit jts.ini.tmpl). Ein
    # leerer Bind-Mount ueberschreibt das und der Container restarted
    # in Endlosschleife (siehe v1.35.1-Fix). Wer Persistenz braucht,
    # macht das via named volume und docker cp der Image-Defaults.

  # ---------------------------------------------------------------------------
  # IBKR Client Portal Gateway als interner Service (LEGACY).
  #
  # Nicht mehr Default-aktiv ab v2.0.0 (Karte 5). Wird nur durch
  # ops/rollback-to-cp.sh hochgezogen, wenn der TWS-Pfad streikt und
  # ein Notfall-Roll-Back noetig wird. Solange die Image-Definition
  # hier steht, kann das Roll-Back-Skript via Profile cp-legacy auf
  # die alte Konfiguration zurueckgreifen.
  #
  # Memory project_cpgateway_auth_stagnation dokumentiert, warum dieser
  # Service strukturell broken war (clientportal.gw 2023 + api.ibkr.com
  # 2026: SRP-Handshake klappt, Server etabliert keine Session,
  # Dispatcher liefert Login-Form-HTML). Der TWS-Pfad (gnzsnz +
  # ib_async) umgeht das komplett.
  #
  # 30-Tage-Frist: wenn der TWS-Stack stabil bleibt, wird der gesamte
  # cpgateway-Service in einer Folgekarte komplett aus dem Repo entfernt
  # (compose.yaml + ops/cpgateway/ + Dockerfile.cpgateway + src/
  # broker_gateway/cp/* + alle Auto-Login-Sidecars).
  # ---------------------------------------------------------------------------
  cpgateway:
    profiles: ["cp-legacy"]
    build:
      context: ops/cpgateway
      dockerfile: ../../Dockerfile.cpgateway
      args:
        # Match an den Host-User auf cma-pi-1 (id cma -> 1000:1000). Damit
        # landen die ueber das logs-Volume rausgereichten Log-Dateien als
        # cma:cma auf dem Host und sind ohne sudo lesbar/rotierbar. Override
        # per .env (CPGW_UID, CPGW_GID), wenn der Ziel-Host eine andere UID hat.
        CPGW_UID: ${CPGW_UID:-1000}
        CPGW_GID: ${CPGW_GID:-1000}
    image: broker-cpgateway:1.0.3
    container_name: ${COMPOSE_PROJECT_NAME:-broker-gateway}-cpgateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BG_CPGATEWAY_HOST_PORT:-5000}:5000"
    volumes:
      # CP-Gateway-Logs persistieren - bei Container-Restart bleiben sie
      # erhalten und sind ohne docker exec einsehbar. Beim Paper-Stack
      # liegt das Volume unter /mnt/ssd/broker-gateway-paper/var/
      # cpgateway-paper/logs (siehe ops/build-gateway.sh --env=paper).
      - ${BG_CPGATEWAY_VOLUME:-./var/cpgateway/logs}:/opt/clientportal.gw/logs
    healthcheck:
      # 401 unauth ist erwartet, solange kein Browser-Login erfolgte -
      # zeigt aber, dass der HTTP-Listener up ist. Erst nach erfolgreichem
      # Login liefert der Endpunkt 200.
      test:
        - "CMD-SHELL"
        - "curl -sS -o /dev/null -w '%{http_code}' http://localhost:5000/v1/api/one/user | grep -E '^(200|401)$' >/dev/null"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
