name: broker-gateway

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: broker-gateway:1.32.0
    container_name: ${COMPOSE_PROJECT_NAME:-broker-gateway}
    restart: unless-stopped
    # Extern 4000 (Default laut API-Draft 1.1) bzw. 4001 fuer den
    # Paper-Stack (siehe ops/build-gateway.sh --env=paper). Intern
    # 8000 (FastAPI/Dockerfile-CMD). Port 8000 ist auf cma-pi-1 von
    # KanPrompt belegt.
    ports:
      - "${BG_GATEWAY_HOST_PORT:-4000}:8000"
    # .env liegt nur lokal und ist gitignored - enthaelt mindestens
    # BG_BOOTSTRAP_ADMIN_TOKEN. Vorlage in .env.example. Beim
    # paper-Deploy ueber ops/build-gateway.sh --env=paper kommt
    # docker compose --env-file .env.paper zum Einsatz.
    env_file:
      - path: ${BG_ENV_FILE:-.env}
        required: false
    depends_on:
      cpgateway:
        condition: service_healthy

  # IBKR Client Portal Gateway als interner Service. Im Compose-Netz
  # erreichbar via http://cpgateway:5000 (gateway-Service intern). Auf dem
  # Host liegt der Port hinter einem 127.0.0.1-Bind, damit ein Browser
  # auf der Pi-Desktop-Session den Recovery-Login direkt ueber localhost
  # machen kann (siehe docs/runbooks/cpgateway-pi-desktop-login.md).
  # Live-Stack: 127.0.0.1:5000, Paper-Stack: 127.0.0.1:5001 (Wert kommt
  # aus BG_CPGATEWAY_HOST_PORT, gesetzt von ops/build-gateway.sh).
  # Bewusst KEIN 0.0.0.0-Bind: cpgateway hat keine eigene Auth-Schicht
  # vor dem SRP-Login.
  cpgateway:
    build:
      context: ops/cpgateway
      dockerfile: ../../Dockerfile.cpgateway
      args:
        # Match an den Host-User auf cma-pi-1 (id cma -> 1000:1000). Damit
        # landen die ueber das logs-Volume rausgereichten Log-Dateien als
        # cma:cma auf dem Host und sind ohne sudo lesbar/rotierbar. Override
        # per .env (CPGW_UID, CPGW_GID), wenn der Ziel-Host eine andere UID hat.
        CPGW_UID: ${CPGW_UID:-1000}
        CPGW_GID: ${CPGW_GID:-1000}
    image: broker-cpgateway:1.0.3
    container_name: ${COMPOSE_PROJECT_NAME:-broker-gateway}-cpgateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BG_CPGATEWAY_HOST_PORT:-5000}:5000"
    volumes:
      # CP-Gateway-Logs persistieren - bei Container-Restart bleiben sie
      # erhalten und sind ohne docker exec einsehbar. Beim Paper-Stack
      # liegt das Volume unter /mnt/ssd/broker-gateway-paper/var/
      # cpgateway-paper/logs (siehe ops/build-gateway.sh --env=paper).
      - ${BG_CPGATEWAY_VOLUME:-./var/cpgateway/logs}:/opt/clientportal.gw/logs
    healthcheck:
      # 401 unauth ist erwartet, solange kein Browser-Login erfolgte -
      # zeigt aber, dass der HTTP-Listener up ist. Erst nach erfolgreichem
      # Login liefert der Endpunkt 200.
      test:
        - "CMD-SHELL"
        - "curl -sS -o /dev/null -w '%{http_code}' http://localhost:5000/v1/api/one/user | grep -E '^(200|401)$' >/dev/null"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # IBKR Trader Workstation API ueber IB Gateway 10.45.1e + IBC 3.23.0
  # (gnzsnz-Image). Parallel-Service zu cpgateway in dieser Karte; der
  # Cutover (gateway-Service haengt zukuenftig an tws statt cpgateway)
  # erfolgt in Folge-Karten 5 und 6. Dokumentation: ops/tws/README.md.
  #
  # Host-Port-Bind nur 127.0.0.1, damit der Smoke-Pfad (Phase 3) ueber
  # localhost erreichbar ist. Externe Erreichbarkeit ist bewusst nicht
  # vorgesehen - der Adapter spricht intern ueber tws:4001 (Live) bzw.
  # tws:4002 (Paper). Default-Host-Port 4101 (Live) / 4102 (Paper) -
  # 4001/4002 direkt am Host wuerden mit gateway-paper:4001 kollidieren
  # (Live- und Paper-Stack teilen den Host-Port-Namespace auf cma-pi-1).
  tws:
    image: ghcr.io/gnzsnz/ib-gateway:10.45.1e
    container_name: ${COMPOSE_PROJECT_NAME:-broker-gateway}-tws
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BG_TWS_HOST_PORT:-4101}:${BG_TWS_INTERNAL_PORT:-4001}"
    env_file:
      - path: ${BG_ENV_FILE:-.env}
        required: false
    environment:
      # Pflicht-ENVs (Login + Modus). TWS_USERID/TWS_PASSWORD kommen aus
      # dem env_file (.env / .env.paper) - hier nur Pass-Through.
      TWS_USERID: ${TWS_USERID:-}
      TWS_PASSWORD: ${TWS_PASSWORD:-}
      TRADING_MODE: ${BG_TRADING_MODE:-paper}
      # Spike-Quirks (siehe ops/tws/config.ini.tmpl).
      EXISTING_SESSION_DETECTED_ACTION: ${EXISTING_SESSION_DETECTED_ACTION:-primary}
      TWS_ACCEPT_INCOMING: ${TWS_ACCEPT_INCOMING:-accept}
      READ_ONLY_API: ${TWS_READ_ONLY_API:-yes}
      ALLOW_BLIND_TRADING: ${ALLOW_BLIND_TRADING:-no}
      # gnzsnz-Defaults fuer headless Betrieb.
      BYPASS_WARNING: ${BYPASS_WARNING:-yes}
      SAVE_TWS_SETTINGS: ${SAVE_TWS_SETTINGS:-yes}
      AUTO_RESTART_TIME: ${AUTO_RESTART_TIME:-11:59 PM}
      AUTO_LOGOFF_TIME: ${AUTO_LOGOFF_TIME:-}
      # Bridge-Range fuer eingehende API-Connects. IBC prepended 127.0.0.1
      # automatisch (siehe ops/tws/config.ini.tmpl Sektion 6). Wer den
      # tws-Container in einem ungewoehnlichen Bridge-Subnetz betreibt,
      # passt den Default in der .env an.
      TWS_TRUSTED_IPS: ${TWS_TRUSTED_IPS:-172.16.0.0/12}
      # 2FA fuer Live-Konto. Paper laesst das alles leer.
      RELOGIN_AFTER_TWOFA_TIMEOUT: ${RELOGIN_AFTER_TWOFA_TIMEOUT:-yes}
      TWOFA_DEVICE: ${TWOFA_DEVICE:-}
      TWOFA_EXIT_INTERVAL: ${TWOFA_EXIT_INTERVAL:-}
      TWS_COLD_RESTART: ${TWS_COLD_RESTART:-}
      TWS_MASTER_CLIENT_ID: ${TWS_MASTER_CLIENT_ID:-}
      TIME_ZONE: ${TWS_TIME_ZONE:-Europe/Vienna}
    volumes:
      # Persistente Account-Settings + Logs des IB Gateways. Der Container
      # schreibt seinen Zustand zwischen Starts in dieses Verzeichnis -
      # ohne den volume-Mount geht die UI-Persistenz beim Restart verloren.
      - tws-settings:/home/ibgateway/Jts
      # Eigene IBC- und jts-Templates (Spike-Quirks gepinnt). Der bind-
      # mount auf eine Datei innerhalb des tws-settings-Volumes ist
      # zulaessig und ueberschreibt die einzelne Datei.
      - ./ops/tws/config.ini.tmpl:/home/ibgateway/ibc/config.ini.tmpl:ro
      - ./ops/tws/jts.ini.tmpl:/home/ibgateway/Jts/jts.ini.tmpl:ro

volumes:
  tws-settings:
    name: ${COMPOSE_PROJECT_NAME:-broker-gateway}_tws-settings
