name: broker-gateway

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: broker-gateway:1.35.1
    container_name: ${COMPOSE_PROJECT_NAME:-broker-gateway}
    restart: unless-stopped
    # Extern 4000 (Default laut API-Draft 1.1) bzw. 4001 fuer den
    # Paper-Stack (siehe ops/build-gateway.sh --env=paper). Intern
    # 8000 (FastAPI/Dockerfile-CMD). Port 8000 ist auf cma-pi-1 von
    # KanPrompt belegt.
    ports:
      - "${BG_GATEWAY_HOST_PORT:-4000}:8000"
    # .env liegt nur lokal und ist gitignored - enthaelt mindestens
    # BG_BOOTSTRAP_ADMIN_TOKEN. Vorlage in .env.example. Beim
    # paper-Deploy ueber ops/build-gateway.sh --env=paper kommt
    # docker compose --env-file .env.paper zum Einsatz.
    #
    # BG_BACKEND (Karte 33cb35b1, optional): waehlt zwischen ``cp``
    # (cpgateway-Backend, Default) und ``tws`` (IBKR TWS-API ueber
    # ib_async + IB Gateway). Solange dieser Compose-Stack den
    # cpgateway-Service haelt, bleibt cp der Default. Wechsel auf tws
    # ist Migration-Karte 6 (Hard-Cutover).
    # BG_TWS_HEARTBEAT_SEC (optional, nur fuer tws): Heartbeat-Intervall
    # in Sekunden, Default 60s.
    env_file:
      - path: ${BG_ENV_FILE:-.env}
        required: false
    depends_on:
      cpgateway:
        condition: service_healthy

  # IBKR Client Portal Gateway als interner Service. Im Compose-Netz
  # erreichbar via http://cpgateway:5000 (gateway-Service intern). Auf dem
  # Host liegt der Port hinter einem 127.0.0.1-Bind, damit ein Browser
  # auf der Pi-Desktop-Session den Recovery-Login direkt ueber localhost
  # machen kann (siehe docs/runbooks/cpgateway-pi-desktop-login.md).
  # Live-Stack: 127.0.0.1:5000, Paper-Stack: 127.0.0.1:5001 (Wert kommt
  # aus BG_CPGATEWAY_HOST_PORT, gesetzt von ops/build-gateway.sh).
  # Bewusst KEIN 0.0.0.0-Bind: cpgateway hat keine eigene Auth-Schicht
  # vor dem SRP-Login.
  cpgateway:
    build:
      context: ops/cpgateway
      dockerfile: ../../Dockerfile.cpgateway
      args:
        # Match an den Host-User auf cma-pi-1 (id cma -> 1000:1000). Damit
        # landen die ueber das logs-Volume rausgereichten Log-Dateien als
        # cma:cma auf dem Host und sind ohne sudo lesbar/rotierbar. Override
        # per .env (CPGW_UID, CPGW_GID), wenn der Ziel-Host eine andere UID hat.
        CPGW_UID: ${CPGW_UID:-1000}
        CPGW_GID: ${CPGW_GID:-1000}
    image: broker-cpgateway:1.0.3
    container_name: ${COMPOSE_PROJECT_NAME:-broker-gateway}-cpgateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BG_CPGATEWAY_HOST_PORT:-5000}:5000"
    volumes:
      # CP-Gateway-Logs persistieren - bei Container-Restart bleiben sie
      # erhalten und sind ohne docker exec einsehbar. Beim Paper-Stack
      # liegt das Volume unter /mnt/ssd/broker-gateway-paper/var/
      # cpgateway-paper/logs (siehe ops/build-gateway.sh --env=paper).
      - ${BG_CPGATEWAY_VOLUME:-./var/cpgateway/logs}:/opt/clientportal.gw/logs
    healthcheck:
      # 401 unauth ist erwartet, solange kein Browser-Login erfolgte -
      # zeigt aber, dass der HTTP-Listener up ist. Erst nach erfolgreichem
      # Login liefert der Endpunkt 200.
      test:
        - "CMD-SHELL"
        - "curl -sS -o /dev/null -w '%{http_code}' http://localhost:5000/v1/api/one/user | grep -E '^(200|401)$' >/dev/null"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
