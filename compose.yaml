name: broker-gateway

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: broker-gateway:1.7.0
    container_name: broker-gateway
    restart: unless-stopped
    # Extern 4000 (Default laut API-Draft 1.1), intern 8000 (FastAPI/Dockerfile-CMD).
    # Port 8000 ist auf cma-pi-1 von KanPrompt belegt.
    ports:
      - "4000:8000"
    # .env liegt nur lokal und ist gitignored - enthaelt mindestens
    # BG_BOOTSTRAP_ADMIN_TOKEN. Vorlage in .env.example.
    env_file:
      - path: .env
        required: false
    depends_on:
      cpgateway:
        condition: service_healthy

  # IBKR Client Portal Gateway als interner Service. Nur intern im Compose-
  # Netzwerk erreichbar (kein published port) - der gateway-Service spricht
  # ueber http://cpgateway:5000, externer Zugriff ausschliesslich ueber
  # SSH-Reverse-Tunnel fuer den Browser-2FA-Login (siehe
  # docs/runbooks/cpgateway-login.md).
  cpgateway:
    build:
      context: ops/cpgateway
      dockerfile: ../../Dockerfile.cpgateway
      args:
        # Match an den Host-User auf cma-pi-1 (id cma -> 1000:1000). Damit
        # landen die ueber das logs-Volume rausgereichten Log-Dateien als
        # cma:cma auf dem Host und sind ohne sudo lesbar/rotierbar. Override
        # per .env (CPGW_UID, CPGW_GID), wenn der Ziel-Host eine andere UID hat.
        CPGW_UID: ${CPGW_UID:-1000}
        CPGW_GID: ${CPGW_GID:-1000}
    image: broker-cpgateway:1.0.3
    container_name: broker-cpgateway
    restart: unless-stopped
    volumes:
      # CP-Gateway-Logs persistieren - bei Container-Restart bleiben sie
      # erhalten und sind ohne docker exec einsehbar.
      - ./var/cpgateway/logs:/opt/clientportal.gw/logs
    healthcheck:
      # 401 unauth ist erwartet, solange kein Browser-Login erfolgte -
      # zeigt aber, dass der HTTP-Listener up ist. Erst nach erfolgreichem
      # Login liefert der Endpunkt 200.
      test:
        - "CMD-SHELL"
        - "curl -sS -o /dev/null -w '%{http_code}' http://localhost:5000/v1/api/one/user | grep -E '^(200|401)$' >/dev/null"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
