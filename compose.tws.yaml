# Override fuer das TWS-Backend (gnzsnz/ib-gateway:stable).
#
# Aktivierungs-Workflow:
#   ./ops/build-gateway.sh --env=paper --backend=tws
#   ./ops/build-gateway.sh --env=live --backend=tws   (Karte 5 / Live-Cutover)
#
# Wirkung:
#   - tws-Service wird zusaetzlich definiert (gnzsnz/ib-gateway:stable mit
#     IBC + Xvfb, hostet TWS-Socket-API).
#   - gateway-Service bekommt BG_BACKEND=tws + BG_TWS_HOST/PORT, sodass der
#     in src/broker_gateway/main.py geprueftes Feature-Flag den TWSLifecycle
#     statt den CPGatewayLifecycle aktiviert (Karte 33cb35b1).
#   - cpgateway-Service bleibt im Stack (Roll-Back-Material). Solange er
#     gestartet ist, kostet er nur Speicher; gateway nutzt ihn aber nicht
#     mehr. Karte 5 (Hard-Cutover) entfernt ihn final aus compose.yaml.
#
# Pflicht-ENV (aus .env-File oder /etc/default/broker-gateway-{paper,live}):
#   BG_TWS_USERNAME       IBKR-Login (cborlm399 fuer paper, chmangold fuer live)
#   BG_TWS_PASSWORD       Passwort dazu - NIEMALS einchecken
#   BG_TWS_TRADING_MODE   paper | live (Default paper)
#
# Optionale ENV:
#   BG_TWS_PORT           Default 4004 (paper-API von gnzsnz). Live wuerde
#                         auf 4003 gehen - der Build-Skript-Pfad setzt den
#                         Wert je nach --env.
#   BG_TWS_HEARTBEAT_SEC  Heartbeat-Intervall, Default 60s (Karte 33cb35b1).
#   BG_TWS_VNC_PASSWORD   VNC-Passwort fuer Notfall-Manualzugriff.
#   BG_TWS_VNC_HOST_PORT  Host-Bind 127.0.0.1:<port>:5900. Default 5905
#                         (paper) bzw. 5906 (live - via Build-Skript).
#   BG_TWS_READ_ONLY      yes (Default) | no. Order-Submission-Pfad
#                         braucht spaeter no, das geht in eine eigene
#                         Folge-Karte (siehe Karte 5 Notes).
#   BG_TWS_VOLUME         Bind-Mount fuer /home/ibgateway/Jts (IBKR-Settings
#                         persistent halten). Default ./var/tws/jts.

services:
  gateway:
    environment:
      - BG_BACKEND=tws
      - BG_TWS_HOST=tws
      - BG_TWS_PORT=${BG_TWS_PORT:-4004}
      - BG_TWS_HEARTBEAT_SEC=${BG_TWS_HEARTBEAT_SEC:-60}
    depends_on:
      tws:
        condition: service_healthy

  tws:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: ${COMPOSE_PROJECT_NAME:-broker-gateway}-tws
    restart: unless-stopped
    environment:
      - TWS_USERID=${BG_TWS_USERNAME:?BG_TWS_USERNAME required (set in .env or /etc/default/broker-gateway-*)}
      - TWS_PASSWORD=${BG_TWS_PASSWORD:?BG_TWS_PASSWORD required}
      - TRADING_MODE=${BG_TWS_TRADING_MODE:-paper}
      - VNC_SERVER_PASSWORD=${BG_TWS_VNC_PASSWORD:-}
      # Schaltet "Allow connections from localhost only" off, damit der
      # gateway-Container ueber das Compose-Bridge-Netz reinkommt.
      - TWS_ACCEPT_INCOMING=accept
      # Read-Only haelt den Trade-Knopf zu, solange wir nur die Read-
      # Pfade brauchen. Order-Submission kommt in einer Folge-Karte.
      - READ_ONLY_API=${BG_TWS_READ_ONLY:-yes}
      - BYPASS_WARNING=yes
      - TIME_ZONE=Europe/Vienna
    ports:
      # VNC fuer Notfall-Manualzugriff. Loopback-Bind, damit der
      # Pi-Host kein offenes 5900 nach aussen zeigt.
      - "127.0.0.1:${BG_TWS_VNC_HOST_PORT:-5905}:5900"
    healthcheck:
      # gnzsnz forwardet die TWS-Socket-API per socat von 4001/4002 auf
      # 4003/4004, damit die App-Side den localhost-only-Bind umgehen
      # kann. Die echte API-Bind-Adresse ist 0.0.0.0 auf 4003 (live)
      # bzw. 4004 (paper). bash -c "exec 3<>/dev/tcp/..." testet das
      # ohne nc/python im Image.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/${BG_TWS_PORT:-4004}"
      interval: 30s
      timeout: 5s
      retries: 3
      # IB Gateway + IBC brauchen ~2 min bis Socket steht (Splash, Xvfb,
      # Login, Configure-Click). start_period unterdrueckt unhealthy-
      # Markierung waehrend dieser Phase.
      start_period: 180s
    volumes:
      # IBKR-Settings persistent halten, sodass nach Container-Recreate
      # die zwischengespeicherten Symbole, Layouts und IB-Server-Pings
      # nicht jedes Mal neu aufgebaut werden muessen.
      - ${BG_TWS_VOLUME:-./var/tws/jts}:/home/ibgateway/Jts
