[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "broker-gateway"
version = "2.5.3"
description = "Versionierte HTTP-API zwischen Consumern und broker-vermittelten Diensten (IBKR Client Portal Gateway)."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Christian Mangold", email = "christian.mangold@railexpertconsult.com" },
]
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "websockets>=12",
    "ib-async>=2.1,<2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "respx>=0.21",
    "pre-commit>=3.0",
    "tzdata>=2024.1",
]

[project.urls]
Repository = "https://github.com/machdat/broker-gateway"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live and not stresstest and not paper_readonly and not paper_safe_write and not paper_pic and not paper_destructive'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: laeuft gegen das Live-CP-Gateway / aktives Live-Konto",
    "stresstest: Stresstest mit hoher Last (manueller Run)",
    "integration: Integrationstest, nicht Standard-Suite",
    "paper_readonly: tests_paper L1 - Read-only gegen Paper-Stack",
    "paper_safe_write: tests_paper L2 - sichere Schreib-Operationen ohne Order-Lifecycle",
    "paper_pic: tests_paper L3 - Place + Immediate Cancel",
    "paper_destructive: tests_paper L4 - Position auf und zu",
]
