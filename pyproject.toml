[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "broker-gateway"
version = "1.23.0"
description = "Versionierte HTTP-API zwischen Consumern und broker-vermittelten Diensten (IBKR Client Portal Gateway)."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Christian Mangold", email = "christian.mangold@railexpertconsult.com" },
]
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "respx>=0.21",
    "pre-commit>=3.0",
]

[project.urls]
Repository = "https://github.com/machdat/broker-gateway"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live and not stresstest'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: laeuft gegen das Live-CP-Gateway / U25235077",
    "stresstest: Stresstest mit hoher Last (manueller Run)",
    "integration: Integrationstest, nicht Standard-Suite",
]
