# IBKR Client Portal Gateway Konfiguration fuer den broker-gateway-Stack.
#
# Diese Datei wird beim Container-Build nach
# /opt/clientportal.gw/root/conf.yaml kopiert und ist die Single Source
# of Truth fuer alle CP-Gateway-Konfigurationswerte. Keine konkurrierenden
# Werte im Dockerfile.cpgateway oder in compose.yaml.
#
# Aenderungen hier erfordern einen Image-Rebuild:
#   docker compose build cpgateway
#   docker compose up -d cpgateway
#
# Basis ist die mitgelieferte Original-conf.yaml von IBKR. Abweichungen
# sind unten am Feld dokumentiert.

ip2loc: "US"
proxyRemoteSsl: true
proxyRemoteHost: "https://api.ibkr.com"
listenPort: 5000
# Plain-HTTP-Listener auf 5000. Abweichend vom IBKR-Default
# (listenSsl: true) - der Service ist nur intern im Compose-Netzwerk
# erreichbar; externer Zugriff (Browser-2FA-Login) erfolgt ueber einen
# SSH-Reverse-Tunnel und nicht ueber published ports. So spart sich
# der gateway-Service ein selbstsigniertes Cert im httpx-Trust-Store.
listenSsl: false
ccp: false
svcEnvironment: "v1"
sslCert: "vertx.jks"
sslPwd: "mywebapi"
authDelay: 3000
portalBaseURL: ""
serverOptions:
    blockedThreadCheckInterval: 1000000
    eventLoopPoolSize: 20
    workerPoolSize: 20
    maxWorkerExecuteTime: 100
    internalBlockingPoolSize: 20
cors:
    origin.allowed: "*"
    allowCredentials: false
webApps:
    - name: "demo"
      index: "index.html"

# IP-Whitelist: alle Standard-Private-Bereiche plus Loopback. Das
# CP-Gateway interpretiert die Eintraege als Glob-aehnliche Patterns
# (intern als Java-Regex), das nackte "*" alleine ist ungueltig
# (RegEx-Compile-Fehler) und fuehrt zu HTTP 500 auf jedem Request.
# Der Default des IBKR-Tarballs ist (192.*, 131.216.*, 127.0.0.1) -
# wir ergaenzen 10.* und 172.* fuer Container-Netzwerke (Compose-
# Default ist 172.x).
ips:
  allow:
    - 127.0.0.1
    - 10.*
    - 172.*
    - 192.168.*
  deny: []
